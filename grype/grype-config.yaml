apiVersion: v1
kind: ConfigMap
metadata:
  name: grype-config
  namespace: security
data:
  grype.yaml: |
    check-for-app-update: false
    fail-on-severity: critical
    severity: critical,high
    output: json
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grype-scan
  namespace: security
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: grype
            image: anchore/grype:latest
            command:
            - grype
            - image
            - --config=/etc/grype/grype.yaml
            - --exit-code=1
            - --severity=CRITICAL,HIGH
            - $(IMAGE_REF)
            env:
            - name: IMAGE_REF
              value: "your-registry/your-image:latest"
            volumeMounts:
            - name: config
              mountPath: /etc/grype
          volumes:
          - name: config
            configMap:
              name: grype-config
          restartPolicy: OnFailure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grype-sa
  namespace: security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grype-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grype-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grype-role
subjects:
- kind: ServiceAccount
  name: grype-sa
  namespace: security
