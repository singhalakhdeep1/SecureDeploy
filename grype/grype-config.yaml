apiVersion: v1
kind: ConfigMap
metadata:
  name: grype-config
  namespace: security
data:
  grype.yaml: |
    check-for-app-update: false
    severity: critical,high
    output: json
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grype-scan
  namespace: security
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          initContainers:
          - name: grype
            image: anchore/grype:latest
            command:
            - grype
            - --config=/etc/grype/grype.yaml
            - -o
            - json
            - --file
            - /output/report.json
            - $(IMAGE_REF)
            env:
            - name: IMAGE_REF
              value: "your-registry/your-image:latest"
            volumeMounts:
            - name: config
              mountPath: /etc/grype
            - name: output
              mountPath: /output
          containers:
          - name: upload
            image: alpine:3.20
            envFrom:
            - configMapRef:
                name: securedeploy-integration
            - secretRef:
                name: securedeploy-webhook
            env:
            - name: IMAGE_REF
              value: "your-registry/your-image:latest"
            command: ["/bin/sh", "-c"]
            args:
            - >-
              apk add --no-cache curl jq >/dev/null &&
              jq -n --slurpfile raw /output/report.json --arg img "$IMAGE_REF" --arg svc "$SERVICE_NAME" --arg env "$ENVIRONMENT" '{tool:"grype", scanId:("grype-cron-" + (now|tostring)), service:$svc, environment:$env, fullScan:true, raw:$raw[0]}' |
              curl -fsS -X POST "$SECUREDEPLOY_URL/api/webhooks/findings"
              -H "Content-Type: application/json" -H "X-Webhook-Secret: $WEBHOOK_SECRET" --data-binary @-
            volumeMounts:
            - name: output
              mountPath: /output
          volumes:
          - name: output
            emptyDir: {}
          - name: config
            configMap:
              name: grype-config
          restartPolicy: OnFailure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grype-sa
  namespace: security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grype-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grype-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grype-role
subjects:
- kind: ServiceAccount
  name: grype-sa
  namespace: security
