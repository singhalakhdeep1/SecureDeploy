name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: securedeploy, POSTGRES_PASSWORD: securedeploy, POSTGRES_DB: securedeploy }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U securedeploy" --health-interval 5s --health-retries 10
    defaults:
      run: { working-directory: backend }
    env:
      DATABASE_URL: postgresql://securedeploy:securedeploy@localhost:5432/securedeploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx jest
      - name: Apply migrations and check for schema drift
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel ../database/schema.prisma --exit-code

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t securedeploy-backend .
      - run: docker build -t securedeploy-frontend frontend
      - run: docker compose config -q
