services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securedeploy
      POSTGRES_USER: securedeploy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securedeploy_password}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securedeploy"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DATABASE_URL: postgresql://securedeploy:${POSTGRES_PASSWORD:-securedeploy_password}@postgres:5432/securedeploy
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-jwt-secret-0123}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-dev-webhook-secret}
      FRONTEND_URL: http://localhost:3000
      PORT: 3001
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:3001/api" }
    ports: ["3000:3000"]
    depends_on: [backend]
    restart: unless-stopped

volumes:
  postgres_data:
